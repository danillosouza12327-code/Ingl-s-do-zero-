<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Inglês do Zero</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2140;--mu:#6b7394;--pr:#4f46e5;--ac:#10b981;--wa:#f59e0b;--rd:#ef4444;--bd:#e4e8f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1226;--card:#1a1f3d;--tx:#eef0ff;--mu:#9aa1c7;--bd:#2a3060}}
:root[data-theme=dark]{--bg:#0f1226;--card:#1a1f3d;--tx:#eef0ff;--mu:#9aa1c7;--bd:#2a3060}
@keyframes pulse{50%{transform:scale(1.1)}}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0}
h1{font-size:24px;margin:4px 0}h2{font-size:18px;margin:4px 0}p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
button,.btn{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--pr);color:#fff;font-weight:700;width:100%;cursor:pointer;margin:6px 0}
button.sec{background:transparent;color:var(--pr);border:2px solid var(--pr)}button.sm{width:auto;padding:6px 10px;font-size:13px;margin:2px}
button.op{background:var(--card);color:var(--tx);border:2px solid var(--bd);text-align:left}
button.ok{background:#d1fae5;color:#065f46;border-color:var(--ac)}button.no{background:#fee2e2;color:#991b1b;border-color:var(--rd)}
input,select,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:5px 0}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.stats{display:flex;gap:8px}.stats div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:8px;text-align:center;font-size:13px}
.en{font-size:19px;font-weight:700}.pron{color:var(--wa);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;width:100%}nav a{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--mu);cursor:pointer}nav a b{display:block;font-size:20px}nav a.on{color:var(--pr);font-weight:700}
.lock{opacity:.55}.tag{background:var(--pr);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
.pop{animation:p .5s}@keyframes p{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:6px 3px;border-bottom:1px solid var(--bd);text-align:left}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
let L=[],TR=null;
const $=s=>document.querySelector(s),S=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=[];
let me=null,tab='home',st={},claude_sample=null;
const TZOFF=-3*3600e3; // America/Sao_Paulo (sem horário de verão) — mantém consistência com server.js
function td(o=0){let d=new Date(Date.now()+o*864e5+TZOFF);return d.toISOString().slice(0,10)}
const save=()=>api('/api/me','PUT',{xp:me.xp,lvl:me.lvl,done:me.done,rev:me.rev,days:me.days}),hasAcc=u=>u.plan==='premium'&&u.st==='ativo'&&u.exp>=td();
function streak(u){let o=u.days.includes(td(0))?0:1,n=0;while(u.days.includes(td(-(o+n))))n++;return n}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sp(t){try{speechSynthesis.cancel();let s=new SpeechSynthesisUtterance(t);s.lang='en-US';s.rate=.85;speechSynthesis.speak(s)}catch(e){}}
async function go(t){stopSpeak();try{REC&&REC.abort()}catch(e){}tab=t;st={};if(t==='admin'&&me&&me.adm){let r=await api('/api/admin/users');U=r.users||[]}draw()}
function celebrate(m){$('#app').insertAdjacentHTML('afterbegin',`<div class="card hero pop">🎉 ${m}</div>`)}
async function api(p,m='GET',b){try{let r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.getItem('izT')||'')},body:b?JSON.stringify(b):undefined});let j=await r.json().catch(()=>({}));if(r.status==401&&me){localStorage.removeItem('izT');me=null;draw()}return{ok:r.ok,...j}}catch(e){return{ok:false,error:'Sem conexão.'}}}
async function init(){if(localStorage.getItem('izT')){let m=await api('/api/me');if(m.ok){me=m.user;let l=await api('/api/lessons');L=l.lessons||[];await loadTrail();if(me.adm)tab='admin'}}await go(tab);hashMode()}
function nav(){$('#nav').innerHTML=me?`<div>${[['home','🏠','Início'],['course','📚','Curso'],['prac','🎯','Praticar'],['talk','🗣️','Conversação'],['prof','👤','Perfil']].map(x=>`<a class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</a>`).join('')}</div>`:''}
function draw(){nav();let h='';if(!me||st.mode==='pw')h=auth();else if(!st.lesson&&!me.lvl&&!me.adm)h=placement();else h=({home,course,prac,talk,prof,admin})[tab]();$('#app').innerHTML=h;scrollTo(0,0)}
function auth0(){return`<div class="card hero"><h1>Inglês do Zero 🇧🇷➜🇺🇸</h1><p>Aprenda inglês do absoluto zero, no seu ritmo, pelo celular.</p></div><div class="card"><h2>${st.reg?'Criar conta grátis':'Entrar'}</h2>
${st.reg?'<input id=n placeholder="Seu nome"><input id=w placeholder="WhatsApp">':''}<input id=e type=email placeholder="E-mail"><input id=p type=password placeholder="Senha"><p class="mu" id=msg></p>
<button onclick="${st.reg?'reg()':'login()'}">${st.reg?'Cadastrar':'Entrar'}</button><button class="sec" onclick="st.reg=!st.reg;draw()">${st.reg?'Já tenho conta':'Criar conta grátis'}</button><button class="sec" onclick="st.mode='forgot';draw()">Esqueci minha senha</button>
</div>`}
async function login(){let r=await api('/api/login','POST',{e:$('#e').value.trim().toLowerCase(),p:$('#p').value});if(!r.ok)return $('#msg').textContent=r.error||'Erro.';await enter(r)}
async function enter(r){localStorage.setItem('izT',r.token);me=r.user;let l=await api('/api/lessons');L=l.lessons||[];await loadTrail();go(me.adm?'admin':'home')}
async function reg(){let n=$('#n').value.trim(),e=$('#e').value.trim().toLowerCase(),p=$('#p').value;if(!n||!e||p.length<6)return $('#msg').textContent='Preencha nome, e-mail e senha (mín. 6).';let r=await api('/api/register','POST',{n,e,p,w:$('#w').value});if(!r.ok)return $('#msg').textContent=r.error||'Erro.';await enter(r)}
const PT=[['Como se diz "Olá" em inglês?',['Hello','Thanks','Goodbye'],0],['O que significa "Thank you"?',['Desculpe','Obrigado','Tchau'],1],['Complete: I ___ Brazilian.',['is','are','am'],2],['"Do you speak English?" significa:',['Você fala inglês?','Eu falo inglês','Onde fica?'],0]];
function placement(){let i=st.pi||0;if(i>=PT.length){let s=st.ps||0,lv=s<=1?'INICIANTE':s<=3?'BÁSICO':'INTERMEDIÁRIO';return`<div class="card hero pop"><h2>Seu nível atual: ${lv}</h2><p>Recomendamos começar pela aula 1 — Cumprimentos.</p></div><button onclick="me.lvl='${lv}';me.zero=0;save();st={};go('home')">Começar recomendação</button><button class="sec" onclick="me.lvl='INICIANTE';save();go('home')">Começar do absoluto zero</button>`}
let q=PT[i];return`<div class="card hero"><h2>Teste de nível</h2><p class="mu" style="color:#e0e7ff">Pergunta ${i+1} de ${PT.length}</p></div><div class="card"><h2>${q[0]}</h2>${q[1].map((o,j)=>`<button class="op" onclick="st.ps=(st.ps||0)+(${j}==${q[2]}?1:0);st.pi=${i+1};draw()">${o}</button>`).join('')}<button class="sec" onclick="me.lvl='INICIANTE';save();go('home')">Pular: começar do zero</button></div>`}
function home(){let ph=PH[new Date().getDay()],n=streak(me),next=L.findIndex((_,i)=>!me.done.includes(i)),due=me.rev.length;
return`<h1>Olá, ${esc(me.n.split(' ')[0])}! 👋</h1><p class="mu">Vamos aprender inglês hoje?</p>
<div class="card hero"><div class="stats"><div>🔥<br><b>${n} dias</b></div><div>⭐<br><b>${me.xp} XP</b></div><div>📚<br><b>${me.done.length}/${L.length}</b></div></div><p>🎯 Meta diária: 1 aula</p><div class="bar"><i style="width:${me.done.length/L.length*100}%"></i></div>
${next>=0?`<button style="background:#fff;color:#4f46e5" onclick="open_(${next})">CONTINUAR AULA</button><p class="mu" style="color:#e0e7ff">Aula atual: ${L[next][2]}</p>`:'<p>🏆 Você concluiu todas as aulas!</p>'}</div>
${TR?homeTrail():''}<div class="card row"><div><p class="mu">💡 Frase do dia</p><div class="en">${ph[0]}</div><p class="mu">${ph[1]}</p></div><button class="sm" onclick="sp('${ph[0]}')">🔊</button></div>
<div class="card row"><div><h2>🔁 Revisão do dia</h2><p class="mu">${due} item(ns) para revisar</p></div><button class="sm" onclick="go('prac')">Revisar</button></div>
<div class="card row"><div><h2>⚡ Desafio diário</h2><p class="mu">Ganhe +20 XP praticando</p></div><button class="sm" onclick="go('prac')">Ir</button></div>
${hasAcc(me)?'':`<div class="card" style="border:2px solid var(--pr)"><h2>⭐ Desbloqueie tudo</h2><p class="mu">${L.length-3} aulas, 5 conversas, revisão e Professor Alex.</p><button onclick="go('prof')">Ver Premium</button></div>`}<p class="mu" style="text-align:center">Você está evoluindo! 🚀</p>`}

async function loadTrail(){let r=await api('/api/trail');TR=r.ok?r:null}
function tstat(){let ls=(me.prog||{}).lessons||{},all=[];TR.levels.forEach(l=>l.mods.forEach(m=>m.lessons.forEach(x=>all.push([l,m,x]))));let done=all.filter(a=>ls[a[2].id]!=null).length,sc=Object.values(ls);return{all,done,nx:all.find(a=>ls[a[2].id]==null),pct:all.length?Math.round(done/all.length*100):0,avg:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0}}
function homeTrail(){let t=tstat();return`<div class="card row"><div><h2>🎓 Trilha com Professor</h2><p class="mu">${t.nx?'Próxima: '+t.nx[2].title:'Novas aulas em breve'} • ${t.pct}%</p></div><button class="sm" onclick="tab='course';st={trail:1};draw()">Abrir</button></div>`}
function course(){if(st.cl)return classView();if(st.tt)return testView();if(st.trail)return trailView();if(!TR)return courseOld();let t=tstat();return`<h1>Curso</h1><div class="card hero"><h2>🎓 Trilha com Professor</h2><p>${t.nx?'Aula atual: '+t.nx[2].title:'Todas as aulas atuais concluídas!'}</p><div class="bar"><i style="width:${t.pct}%"></i></div><p class="mu" style="color:#e0e7ff">${t.pct}% • ${t.done}/${t.all.length} aulas • do Nível 0 ao C2</p><button style="background:#fff;color:#4f46e5" onclick="st.trail=1;draw()">Abrir trilha</button></div><h2 style="margin-top:18px">Aulas rápidas</h2>`+courseOld().replace('<h1>Curso</h1>','')}
function trailView(){let t=tstat(),pr=me.prog||{},ls=pr.lessons||{},ms=pr.mods||{};
let h=`<button class="sm sec" onclick="st={};draw()">‹ Voltar</button><h1>Sua trilha</h1><div class="card hero"><p>Você está no <b>${t.nx?t.nx[0].name:'fim do conteúdo atual'}</b>${t.nx?' • Módulo: '+t.nx[1].title+' • Aula: '+t.nx[2].title:''}</p><div class="stats"><div>📈<br><b>${t.pct}%</b></div><div>🔥<br><b>${streak(me)}d</b></div><div>⭐<br><b>${me.xp}</b></div><div>📚<br><b>${t.done}</b></div></div><p>Pontuação média: ${t.avg}%</p></div>`;
TR.levels.forEach(l=>{h+=`<h2 style="margin-top:16px">${l.name}</h2>`;l.mods.forEach(m=>{let lk=m.soon?'🕒 Em produção':!m.open?'🔒 Passe no teste do módulo anterior (nota 70%)':m.prem?'🔒 Premium':'';h+=`<div class="card ${lk?'lock':''}"><b>${m.title}</b>${lk?`<p class="mu">${lk}</p>`:m.lessons.map(x=>`<div class="row" style="padding:8px 0" onclick="openClass('${x.id}')"><span>${ls[x.id]!=null?'✅':'▶️'} ${x.title}</span><span class="mu">${ls[x.id]!=null?ls[x.id]+'%':''}</span></div>`).join('')+(m.test?`<button class="sm" onclick="openTest('${m.id}')">${ms[m.id]!=null?'Refazer teste ('+ms[m.id]+'%)':'🧠 Teste do módulo'}</button>`:'')}</div>`})});return h}
async function openClass(id){let r=await api('/api/lesson/'+id);if(!r.ok)return alert(r.error||'Aula indisponível.');st={trail:1,cl:{LS:r.lesson,s:0,i:0,rate:1,tr:1,sc:0,tot:0,qi:0,fala:{}}};draw()}
function stopT(){try{speechSynthesis.cancel()}catch(e){};let a=$('#av');if(a)a.style.animation=''}
function tPlay(i,once){let c=st.cl,ln=c.LS.script[i];stopT();if(!ln){if(!c.w){c.w=1;me.xp+=5;save()}$('#sub').textContent='Fim da explicação! Vamos praticar 👏';$('#trn').textContent='';return}c.i=i;$('#sub').textContent=ln.t;$('#trn').textContent=c.tr?(ln.tr||''):'';
 try{let u=new SpeechSynthesisUtterance(ln.t),a=$('#av');u.lang=ln.l=='en'?'en-US':'pt-BR';u.rate=c.rate*(ln.l=='en'?.85:1);u.onend=()=>{let a=$('#av');if(a)a.style.animation='';if(!once&&st.cl===c)tPlay(i+1)};if(a)a.style.animation='pulse 1s infinite';speechSynthesis.speak(u)}catch(e){}}
function nextS(n){stopT();let c=st.cl;c.s=n;if(n==4&&!c.Q)c.Q=[{audio:c.LS.listen.t,q:'Ouça o áudio. O que significa?',ops:c.LS.listen.ops,a:c.LS.listen.a}].concat(c.LS.quiz);draw()}
function classView(){let c=st.cl,X=c.LS,ST=['Aula','Pronúncia','Fale','Escreva','Ouça e teste','Resultado'];
let hd=`<button class="sm sec" onclick="stopT();st={trail:1};draw()">‹ Trilha</button><h2>${X.title}</h2><div class="bar"><i style="width:${c.s/5*100}%"></i></div><p class="mu">${ST[c.s]} • etapa ${c.s+1}/6</p>`;
if(c.s==0)return hd+`<div class="card" style="text-align:center">${X.video?`<video src="${X.video}" controls playsinline style="width:100%;border-radius:12px"></video>`:X.embed?`<iframe src="${X.embed}" style="width:100%;height:200px;border:0;border-radius:12px" allowfullscreen></iframe>`:`<div id=av style="font-size:64px">🧑‍🏫</div><b>Professor Alex</b>`}<div id=sub class="en" style="min-height:52px;margin-top:8px">Toque em ▶️ para começar a aula</div><div id=trn class="mu" style="min-height:22px">${c.tr?'':''}</div><div class="row"><button class="sm" onclick="tPlay(0)">⏮ Início</button><button class="sm" onclick="tPlay(st.cl.i)">▶️</button><button class="sm" onclick="stopT()">⏸</button><button class="sm" onclick="tPlay(st.cl.i,1)">🔁 Repetir</button></div><div class="row"><span class="mu">Velocidade</span>${[.7,1,1.2].map(r=>`<button class="sm ${c.rate==r?'':'sec'}" onclick="stopT();st.cl.rate=${r};draw()">${r}x</button>`).join('')}<button class="sm sec" onclick="stopT();st.cl.tr=!st.cl.tr;draw()">Tradução ${c.tr?'✓':'✗'}</button></div></div><button onclick="nextS(1)">Ir para a pronúncia ›</button>`;
if(c.s==1)return hd+`<p class="mu">⚠️ A pronúncia aproximada é só um auxílio para brasileiros e não substitui a pronúncia real (use 🔊).</p>`+X.vocab.map(v=>`<div class="card row"><div><div class="en">${v[0]}</div><div>${v[1]}</div><div class="pron">🗣️ ${v[2]}</div></div><button class="sm" onclick="sp('${v[0].replace(/'/g,'')}')">🔊</button></div>`).join('')+`<button onclick="nextS(2)">Praticar a fala ›</button>`;
if(c.s==2)return hd+`<p>Ouça → Repita → Compare → Tente novamente.</p>`+X.vocab.slice(0,3).map((v,i)=>`<div class="card"><div class="en">${v[0]}</div><div class="row"><button class="sm" onclick="sp('${v[0].replace(/'/g,'')}')">🔊 Ouvir</button><button class="sm" onclick="say(${i})">🎤 Repetir</button></div><p id=fr${i}>${c.fala[i]||''}</p></div>`).join('')+`<button onclick="nextS(3)">Continuar ›</button>`;
if(c.s==3)return hd+`<div class="card"><h2>✍️ ${X.write.q}</h2><input id=wa placeholder="Digite em inglês"><button onclick="chkW()">Verificar</button><div id=wf></div></div><button class="sec" onclick="nextS(4)">Continuar ›</button>`;
if(c.s==4){let q=c.Q[c.qi];if(!q)return hd+`<button onclick="nextS(5)">Ver resultado ›</button>`;return hd+`<div class="card"><p class="mu">Pergunta ${c.qi+1}/${c.Q.length}</p>${q.audio?`<button class="sm" onclick="sp('${q.audio.replace(/'/g,'')}')">🔊 Ouvir áudio</button>`:''}<h2>${q.q}</h2>${q.ops.map((o,j)=>`<button class="op" onclick="qa(${j})">${o}</button>`).join('')}<div id=qf></div></div>`}
let sc=c.tot?Math.round(c.sc/c.tot*100):0;return hd+`<div class="card hero pop"><h1>${sc>=70?'🎉 Ótimo!':'💪 Continue!'}</h1><p>Pontuação da aula: ${sc}% • +20 XP ao concluir</p></div><button onclick="finish()">✅ Concluir aula</button>`}
function say(i){let v=st.cl.LS.vocab[i][0],R=window.SpeechRecognition||window.webkitSpeechRecognition,ok=s=>{st.cl.fala[i]=s;let e=$('#fr'+i);if(e)e.textContent=s;if(s[0]=='✅'){me.xp+=3;save()}};if(!R)return ok('✅ Anotado! Compare com o áudio 🔊 (seu aparelho não tem reconhecimento de voz).');let r=new R();r.lang='en-US';r.onresult=e=>{let h=e.results[0][0].transcript,n=x=>x.toLowerCase().replace(/[^a-z ]/g,'').trim(),a=n(v).split(' '),b=n(h).split(' ');ok(a.filter(w=>b.includes(w)).length/a.length>=.6?'✅ Muito bem! Entendi: '+h:'🔁 Entendi: "'+h+'". Ouça de novo e tente outra vez.')};r.onerror=()=>ok('⚠️ Não consegui ouvir. Tente de novo.');r.start()}
function chkW(){let c=st.cl,n=x=>x.toLowerCase().replace(/[^a-z ]/g,'').trim(),v=n($('#wa').value),ok=c.LS.write.a.some(a=>n(a)==v);if(ok&&!c.wd){c.wd=1;me.xp+=5;save()}$('#wf').innerHTML=ok?'<p>✅ Correto!</p>':'<p>❌ Resposta: <b>'+c.LS.write.a[0]+'</b></p>'}
function qa(j){let c=st.cl,q=c.Q[c.qi],b=document.querySelectorAll('.op');b.forEach(x=>x.disabled=true);b[j].classList.add(j==q.a?'ok':'no');if(j==q.a){c.sc++;me.xp+=5}c.tot++;$('#qf').innerHTML=`<p>${j==q.a?'✅ Muito bem!':'❌ Resposta: <b>'+q.ops[q.a]+'</b>'}</p><button onclick="st.cl.qi++;draw()">Continuar ›</button>`}
async function finish(){let c=st.cl;if(c.paid)return;c.paid=1;let sc=c.tot?Math.round(c.sc/c.tot*100):0,r=await api('/api/lesson/'+c.LS.id,'POST',{score:sc});if(r.ok){me.prog=r.prog;me.xp+=20;save()}await loadTrail();st={trail:1};draw()}
async function openTest(id){let r=await api('/api/modtest/'+id);if(!r.ok)return alert(r.error||'Indisponível.');st={trail:1,tt:{id,Q:r.questions,qi:0,ans:[]}};draw()}
function testView(){let t=st.tt,q=t.Q[t.qi];if(t.res)return`<div class="card hero pop"><h1>${t.res.pass?'🎉 Módulo concluído!':'💪 Quase lá!'}</h1><p>Nota: ${t.res.score}% (mínimo 70%)</p><p>${t.res.pass?'O próximo módulo foi liberado.':'Revise as aulas e tente de novo.'}</p></div><button onclick="closeTest()">Voltar à trilha</button>`;
return`<h2>🧠 Teste do módulo</h2><div class="bar"><i style="width:${t.qi/t.Q.length*100}%"></i></div><div class="card"><p class="mu">Pergunta ${t.qi+1}/${t.Q.length}</p><h2>${q.q}</h2>${q.ops.map((o,j)=>`<button class="op" onclick="tAns(${j})">${o}</button>`).join('')}</div>`}

return`<h1>Perfil</h1><div class="card"><div class="row"><div><h2>👤 ${esc(me.n)}</h2><p class="mu">${esc(me.e)}</p></div><span class="tag">${me.lvl||'INICIANTE'}</span></div><p>⭐ ${me.xp} XP • 🔥 ${n} dias • 📚 ${me.done.length}/${L.length} aulas</p><div class="bar"><i style="width:${me.done.length/L.length*100}%"></i></div><p>🏅 Medalhas: ${med.join(' ')||'ainda nenhuma — bora!'}</p></div>
<div class="card"><h2>Plano: ${hasAcc(me)?'⭐ Premium':'Gratuito'}</h2>${hasAcc(me)?`<p class="mu">Válido até ${me.exp}</p>`:`<p>Desbloqueie todos os níveis, conversação, Professor Alex, revisões e desafios.</p><p class="en">Premium — R$ 29,90/mês</p><button onclick="buy(me.n,me.e)">💳 Assinar agora (Pix ou cartão)</button><p class="mu">Acesso liberado automaticamente após o pagamento.</p>`}</div>
${me.adm?'<button onclick="go(\'admin\')">Painel administrativo</button>':''}<button class="sec" onclick="me=null;localStorage.removeItem('izT');tab='home';draw()">Sair</button>`}
function admin(){if(!me.adm)return prof();let a=U.filter(u=>!u.adm),at=a.filter(u=>u.st==='ativo'),ex=a.filter(u=>u.exp<td(7)&&u.plan==='premium'),pm=a.length?Math.round(a.reduce((s,u)=>s+u.done.length,0)/a.length/L.length*100):0;
return`<h1>Painel Admin</h1><div class="card"><div class="stats" style="color:var(--tx)"><div>👥<br><b>${a.length}</b><br>alunos</div><div>✅<br><b>${at.length}</b><br>ativos</div><div>⭐<br><b>${a.filter(hasAcc).length}</b><br>premium</div><div>📈<br><b>${pm}%</b><br>progresso</div></div><p class="mu">⏰ Expirando em 7 dias: ${ex.length}</p></div>
<div class="card"><h2>Liberar / cadastrar aluno</h2><input id=an placeholder="Nome"><input id=aw placeholder="WhatsApp"><input id=ae placeholder="E-mail"><input id=ap placeholder="Senha inicial"><select id=apl><option value=premium>Premium</option><option value=gratis>Gratuito</option></select><input id=ax type=date value="${td(30)}"><button onclick="addS()">Cadastrar e liberar</button></div>
<div class="card"><h2>Alunos</h2><table><tr><th>Nome</th><th>Plano</th><th>Vence</th><th></th></tr>${a.map((u,i)=>`<tr><td>${esc(u.n)}<br><span class="mu">${esc(u.w||u.e)}</span></td><td>${u.plan}</td><td>${u.exp==='2099-12-31'?'-':u.exp}</td><td><button class="sm" onclick="tg('${escAttr(u.e)}','${u.st==='ativo'?'bloqueado':'ativo'}')">${u.st==='ativo'?'Bloquear':'Liberar'}</button><button class="sm sec" onclick="pr('${escAttr(u.e)}')">${u.plan==='premium'?'→Grátis':'→Premium'}</button></td></tr>`).join('')||'<tr><td colspan=4>Nenhum aluno ainda.</td></tr>'}</table></div>
<div class="card"><h2>Aulas mais concluídas</h2>${L.map((l,i)=>[l[2],a.filter(u=>u.done.includes(i)).length]).sort((x,y)=>y[1]-x[1]).slice(0,4).map(x=>`<p>${x[0]}: <b>${x[1]}</b></p>`).join('')}</div>`}
async function addS(){let r=await api('/api/admin/users','POST',{n:$('#an').value,w:$('#aw').value,e:$('#ae').value.trim().toLowerCase(),p:$('#ap').value,plan:$('#apl').value,exp:$('#ax').value});if(!r.ok)return alert(r.error||'Erro');go('admin')}
async function tg(e,s){await api('/api/admin/users','PATCH',{e,st:s});go('admin')}
async function pr(e){let u=U.find(x=>x.e===e),pl=u.plan==='premium'?'gratis':'premium';await api('/api/admin/users','PATCH',{e,plan:pl,exp:pl==='premium'&&u.exp<td()?td(30):u.exp});go('admin')}
function auth(){let M=st.mode,x=(a,b,c)=>`<div class="card hero"><h1>${a}</h1><p>${b}</p></div><div class="card">${c}<p class="mu" id=msg></p></div>`;
if(M==='paid')return x('Pagamento recebido! 🎉','Enviamos um e-mail com o link para criar sua senha. Depois é só entrar.',`<button onclick="location.hash='';st={};draw()">Ir para o login</button>`);
if(M==='pw')return x('Crie sua senha 🔐','Escolha uma senha para acessar o Inglês do Zero.',`<input id=p type=password placeholder="Nova senha (mín. 6)"><button onclick="setPw()">Salvar e entrar</button>`);
if(M==='buy')return x('Inglês do Zero Premium ⭐','✅ Todas as aulas, do zero ao trabalho<br>✅ 6 conversas práticas de viagem e dia a dia<br>✅ Professor Alex tira dúvidas<br>✅ Revisão inteligente<br>Pague por Pix ou cartão e receba o acesso por e-mail na hora.',`<input id=bn placeholder="Seu nome"><input id=be type=email placeholder="Seu melhor e-mail"><button onclick="buy()">Ir para o pagamento ›</button><button class="sec" onclick="location.href='/'">Já tenho conta</button>`);
if(M==='forgot')return x('Recuperar senha','Informe seu e-mail e enviaremos um link.',`<input id=e type=email placeholder="E-mail"><button onclick="forgot()">Enviar link</button><button class="sec" onclick="st={};draw()">Voltar</button>`);
return auth0()}
function hashMode(){let h=location.hash;if(h.startsWith('#senha='))st={mode:'pw',t:h.slice(7)};else if(location.pathname==='/comprar'&&!me)st={mode:'buy'};else if(h==='#pago'&&!me)st={mode:'paid'};else return;draw()}
async function buy(n,e){n=n||$('#bn').value;e=e||$('#be').value;let r=await api('/api/buy','POST',{n,e});if(r.url)location.href=r.url;else alert(r.error||'Erro')}
async function forgot(){await api('/api/forgot','POST',{e:$('#e').value});$('#msg').textContent='Se o e-mail existir, enviamos o link. Confira sua caixa de entrada.'}
async function setPw(){let r=await api('/api/set-password','POST',{t:st.t,p:$('#p').value});if(!r.ok)return $('#msg').textContent=r.error||'Erro';location.hash='';await enter(r)}
init();
</script></body></html>
